<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>열평형 가상실험 - 디지털 온도계</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { font-family: sans-serif; text-align: center; }
    .main-container { display: flex; justify-content: center; gap: 20px; margin-top: 50px; }
    .container { display: flex; gap: 20px; align-items: flex-end; flex-wrap: wrap; justify-content: center; }
    .area { border: 2px solid #aaa; padding: 10px; width: 200px; height: 250px; position: relative; text-align: center; overflow: hidden; background-color: white; }
    .thermometer-box {
      border: 2px solid #aaa;
      padding: 10px;
      width: 200px;
      height: 250px;
      background-color: white;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .thermometer-row {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-top: 30px;
    }
    .beaker-img { width: 100px; height: auto; display: block; margin: 40px auto 0; }
    .metal-rod { background-color: silver; width: 40px; height: 100px; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); z-index: 2; }
    .fill { position: absolute; bottom: 0; left: 0; width: 100%; height: 0; transition: height 1s ease; z-index: 1; }
    .cold-fill { background-color: lightblue; }
    .hot-fill { background-color: red; }
    .thermometer {
      width: 20px;
      height: 100px;
      --background-color: #ccc;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: grab;
      position: relative;
      z-index: 1000;
    }
    .thermometer .display {
      width: 60px;
      height: 25px;
      background-color: black;
      color: lime;
      text-align: center;
      font-weight: bold;
      font-size: 14px;
      border-radius: 4px;
      --margin-bottom: 4px;
      z-index: 1001;
    }
    .thermometer .bar {
      width: 4px;
      height: 80px;
      background-color: black;
      border-radius: 2px;
    }
    #result { margin-top: 20px; font-size: 18px; text-align: center; }
    .btn-simulate { margin: 10px; display: block; margin-left: auto; margin-right: auto; }
    .label-text {
      font-weight: bold;
      margin-bottom: 5px;
      text-align: center;
    }
    #warningMsg {
      color: red;
      font-weight: bold;
      display: none;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>열평형 가상실험</h1>
  <h5>찬물과 뜨거운물을 열량계에 붓고, 온도계를 열량계에 넣어주세요!!!</h5>
  <h5>버튼을 누르면 시간경과에 따른 [물의 온도 변화]를 알 수 있습니다!</h5>
  <div class="main-container">
    <div class="container">
      <div id="coldBeakerArea" class="area">
        <div class="label-text">찬물 비이커</div>
        <img id="coldWater" src="./data/beaker-blue2.png" class="beaker-img draggable" draggable="true" alt="찬물 비이커">
      </div>
      <div id="hotBeakerArea" class="area">
        <div class="label-text">뜨거운 물 비이커</div>
        <img id="hotWater" src="./data/beaker-red.png" class="beaker-img draggable" draggable="true" alt="뜨거운물 비이커">
      </div>
      <div id="calorimeterArea" class="area">
        <div class="label-text">열량계</div>
        <div id="coldFill" class="fill cold-fill"></div>
        <div class="metal-rod" id="metalRod">
          <div id="hotFill" class="fill hot-fill"></div>
        </div>
      </div>
      <div class="thermometer-box">
        <div class="label-text">온도계</div>
        <div class="thermometer-row">
          <div id="coldThermometer" class="thermometer draggable" draggable="true">
            <div class="display" id="coldDisplay">--.-°C</div>
            <div class="bar"></div>
          </div>
          <div id="hotThermometer" class="thermometer draggable" draggable="true">
            <div class="display" id="hotDisplay">--.-°C</div>
            <div class="bar"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <button id="nextBtn" class="btn btn-primary btn-simulate">2분 경과</button>
  <div id="warningMsg">물을 열량계에 붓고 온도계를 넣은 후 눌러주세요!</div>
  <div id="result">현재 온도:<br>찬물: 20.0°C<br>뜨거운 물: 50.0°C</div>
  <script>
    const coldTemps = [20.0, 28.4, 29.7, 30.0, 30.0, 30.0];
    const hotTemps = [50.0, 34.8, 30.8, 30.1, 30.0, 30.0];
    let timeStep = 0;
    let elapsedTime = 0;
    let coldPoured = false;
    let hotPoured = false;
    let coldThermoPlaced = false;
    let hotThermoPlaced = false;

    const coldThermo = document.getElementById('coldThermometer');
    const hotThermo = document.getElementById('hotThermometer');
    const coldDisplay = document.getElementById('coldDisplay');
    const hotDisplay = document.getElementById('hotDisplay');
    const nextBtn = document.getElementById('nextBtn');
    const warningMsg = document.getElementById('warningMsg');

    function updateButtonState() {
      ////nextBtn.disabled = !(coldPoured && hotPoured && coldThermoPlaced && hotThermoPlaced);
    }

    // document.querySelectorAll('.draggable').forEach(elem => {

    //   const startDrop = e => {
    //     const id = e.target.id;
    //     if ((id === 'coldThermometer' || id === 'hotThermometer') && !(coldPoured && hotPoured)) {
    //       e.preventDefault();
    //       return;
    //     }
    //     e.dataTransfer.setData('text/plain', id);
    //   };
 
    //   elem.addEventListener('dragstart', startDrop);
    //   elem.addEventListener('touchstart', startDrop);
    // });

    document.querySelectorAll('.draggable').forEach(elem => {

  // 공통 시작 처리 (드래그 또는 터치)
  const startDrop = e => {
    const id = e.target.id;
    //alert('start' + id);
    if ((id === 'coldThermometer' || id === 'hotThermometer') && !(coldPoured && hotPoured)) {
      e.preventDefault();
      return;
    }
    
    
    // 데스크탑 드래그 데이터 설정
    if (e.dataTransfer) {
      e.dataTransfer.setData('text/plain', id);
    }

    // 모바일: dragging 클래스 추가
    elem.classList.add('dragging');
  };

  elem.addEventListener('dragstart', startDrop);
  elem.addEventListener('touchstart', startDrop);
});



    
    // document.querySelectorAll('.area, .metal-rod').forEach(area => {
    //   area.addEventListener('dragover', e => e.preventDefault());
    //   area.addEventListener('touchend', e => e.preventDefault());

    //   const doDrop = e => {
    //     e.preventDefault();
    //     const id = e.dataTransfer.getData('text/plain');
    //     const el = document.getElementById(id);

    //     if (id === 'coldWater' && area.id === 'calorimeterArea' && !coldPoured) {
    //       document.getElementById('coldFill').style.height = '80px';
    //       coldPoured = true;
    //       el.src = './data/beaker-empty.png';
    //     }
    //     if (id === 'hotWater' && area.id === 'calorimeterArea' && !hotPoured) {
    //       document.getElementById('hotFill').style.height = '72px';
    //       hotPoured = true;
    //       el.src = './data/beaker-empty.png';

    //       area.appendChild(coldThermo);
    //       coldThermo.style.position = 'absolute';
    //       coldThermo.style.left = '10px';
    //       coldThermo.style.bottom = '10px';
    //       coldThermo.style.zIndex = '9999';
    //       coldDisplay.textContent = `${coldTemps[timeStep]}°C`;
    //       coldThermoPlaced = true;
    //     }
    //     if (id === 'hotThermometer' && area.id === 'metalRod') {
    //       area.appendChild(hotThermo);
    //       hotThermo.style.position = 'absolute';
    //       hotThermo.style.left = '10px';
    //       hotThermo.style.bottom = '0px';
    //       hotThermo.style.zIndex = '9999';
    //       hotDisplay.textContent = `${hotTemps[timeStep]}°C`;
    //       hotThermoPlaced = true;
    //     }
    //     updateButtonState();
    //   }
      
    //   area.addEventListener('drop', doDrop);
    //   area.addEventListener('touchmove', doDrop);
    // });

document.querySelectorAll('.area, .metal-rod').forEach(area => {
  // 데스크탑용
  area.addEventListener('dragover', e => e.preventDefault());
  area.addEventListener('drop', e => {
    e.preventDefault();
    const id = e.dataTransfer.getData('text/plain');
    handleDrop(area, id);
  });

  // 모바일용 (터치 종료 시 위치 기반으로 드롭 판단)
  area.addEventListener('touchend', e => {
    alert('touchend');
    const touch = e.changedTouches[0];
    const droppedElement = document.elementFromPoint(touch.clientX, touch.clientY);
    const id = droppedElement?.id;

    if (!id) return;

    const draggingId = document.querySelector('.dragging')?.id;
    if (draggingId) {
      handleDrop(area, draggingId);
      document.querySelector('.dragging')?.classList.remove('dragging');
    }
  });
});

// 공통 드롭 처리 함수
function handleDrop(area, id) {
  const el = document.getElementById(id);
  alert(el);
  if (!el) return;
  
  if (id === 'coldWater' && area.id === 'calorimeterArea' && !coldPoured) {
    document.getElementById('coldFill').style.height = '80px';
    coldPoured = true;
    el.src = './data/beaker-empty.png';
  }
  if (id === 'hotWater' && area.id === 'calorimeterArea' && !hotPoured) {
    document.getElementById('hotFill').style.height = '72px';
    hotPoured = true;
    el.src = './data/beaker-empty.png';
  }
  if (id === 'coldThermometer' && area.id === 'calorimeterArea') {
    area.appendChild(coldThermo);
    coldThermo.style.position = 'absolute';
    coldThermo.style.left = '10px';
    coldThermo.style.bottom = '10px';
    coldThermo.style.zIndex = '9999';
    coldDisplay.textContent = `${coldTemps[timeStep]}°C`;
    coldThermoPlaced = true;
  }
  if (id === 'hotThermometer' && area.id === 'metalRod') {
    area.appendChild(hotThermo);
    hotThermo.style.position = 'absolute';
    hotThermo.style.left = '10px';
    hotThermo.style.bottom = '0px';
    hotThermo.style.zIndex = '9999';
    hotDisplay.textContent = `${hotTemps[timeStep]}°C`;
    hotThermoPlaced = true;
  }

  updateButtonState();
}

    

    nextBtn.addEventListener('click', () => {
      if (!(coldPoured && hotPoured && coldThermoPlaced && hotThermoPlaced)) {
        warningMsg.style.display = 'block';
        setTimeout(() => warningMsg.style.display = 'none', 3000);
        return;
      }
      if (timeStep < coldTemps.length - 1) {
        timeStep++;
        elapsedTime += 2;
        nextBtn.textContent = `${elapsedTime}분 경과`;
        const coldTemp = coldTemps[timeStep];
        const hotTemp = hotTemps[timeStep];
        document.getElementById('result').innerHTML =
          `현재 온도:<br>찬물의 온도: ${coldTemp}°C<br>뜨거운 물의 온도: ${hotTemp}°C`;
        coldDisplay.textContent = `${coldTemp}°C`;
        hotDisplay.textContent = `${hotTemp}°C`;
      } else {
        alert('실험이 완료되었습니다.');
      }
    });
  </script>
</body>
</html>
