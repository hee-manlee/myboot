<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>열평형 가상실험 - 디지털 온도계</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* 기존 스타일 그대로 유지 */
  </style>
</head>
<body>
  <!-- 기존 HTML 구조 그대로 유지 -->
  <!-- (생략) -->

  <script>
    const coldTemps = [20.0, 28.4, 29.7, 30.0, 30.0, 30.0];
    const hotTemps = [50.0, 34.8, 30.8, 30.1, 30.0, 30.0];
    let timeStep = 0;
    let elapsedTime = 0;
    let coldPoured = false;
    let hotPoured = false;
    let coldThermoPlaced = false;
    let hotThermoPlaced = false;

    const coldThermo = document.getElementById('coldThermometer');
    const hotThermo = document.getElementById('hotThermometer');
    const coldDisplay = document.getElementById('coldDisplay');
    const hotDisplay = document.getElementById('hotDisplay');
    const nextBtn = document.getElementById('nextBtn');
    const warningMsg = document.getElementById('warningMsg');

    function updateButtonState() {}

    document.querySelectorAll('.draggable').forEach(elem => {
      elem.addEventListener('dragstart', e => {
        e.dataTransfer.setData('text/plain', e.target.id);
      });

      elem.addEventListener('touchstart', e => {
        const touch = e.touches[0];
        elem.dataset.touchId = elem.id;
        elem.dataset.offsetX = touch.clientX - elem.getBoundingClientRect().left;
        elem.dataset.offsetY = touch.clientY - elem.getBoundingClientRect().top;
      });

      elem.addEventListener('touchmove', e => {
        const touch = e.touches[0];
        const offsetX = parseFloat(elem.dataset.offsetX);
        const offsetY = parseFloat(elem.dataset.offsetY);
        elem.style.position = 'absolute';
        elem.style.left = (touch.clientX - offsetX) + 'px';
        elem.style.top = (touch.clientY - offsetY) + 'px';
        elem.style.zIndex = 9999;
      });

      elem.addEventListener('touchend', e => {
        const touch = e.changedTouches[0];
        const dropTarget = document.elementFromPoint(touch.clientX, touch.clientY);
        const id = elem.id;

        if (id === 'coldWater' && dropTarget.id === 'calorimeterArea' && !coldPoured) {
          document.getElementById('coldFill').style.height = '80px';
          coldPoured = true;
          elem.src = './data/beaker-empty.png';
        }
        if (id === 'hotWater' && dropTarget.id === 'calorimeterArea' && !hotPoured) {
          document.getElementById('hotFill').style.height = '72px';
          hotPoured = true;
          elem.src = './data/beaker-empty.png';
        }
        if (id === 'coldThermometer' && dropTarget.id === 'calorimeterArea') {
          dropTarget.appendChild(coldThermo);
          coldThermo.style.left = '10px';
          coldThermo.style.bottom = '10px';
          coldThermo.style.zIndex = '9999';
          coldDisplay.textContent = `${coldTemps[timeStep]}°C`;
          coldThermoPlaced = true;
        }
        if (id === 'hotThermometer' && dropTarget.id === 'metalRod') {
          dropTarget.appendChild(hotThermo);
          hotThermo.style.left = '10px';
          hotThermo.style.bottom = '0px';
          hotThermo.style.zIndex = '9999';
          hotDisplay.textContent = `${hotTemps[timeStep]}°C`;
          hotThermoPlaced = true;
        }
        updateButtonState();
      });
    });

    document.querySelectorAll('.area, .metal-rod').forEach(area => {
      area.addEventListener('dragover', e => e.preventDefault());
      area.addEventListener('drop', e => {
        e.preventDefault();
        const id = e.dataTransfer.getData('text/plain');
        const el = document.getElementById(id);

        if (id === 'coldWater' && area.id === 'calorimeterArea' && !coldPoured) {
          document.getElementById('coldFill').style.height = '80px';
          coldPoured = true;
          el.src = './data/beaker-empty.png';
        }
        if (id === 'hotWater' && area.id === 'calorimeterArea' && !hotPoured) {
          document.getElementById('hotFill').style.height = '72px';
          hotPoured = true;
          el.src = './data/beaker-empty.png';
        }
        if (id === 'coldThermometer' && area.id === 'calorimeterArea') {
          area.appendChild(coldThermo);
          coldThermo.style.left = '10px';
          coldThermo.style.bottom = '10px';
          coldThermo.style.zIndex = '9999';
          coldDisplay.textContent = `${coldTemps[timeStep]}°C`;
          coldThermoPlaced = true;
        }
        if (id === 'hotThermometer' && area.id === 'metalRod') {
          area.appendChild(hotThermo);
          hotThermo.style.left = '10px';
          hotThermo.style.bottom = '0px';
          hotThermo.style.zIndex = '9999';
          hotDisplay.textContent = `${hotTemps[timeStep]}°C`;
          hotThermoPlaced = true;
        }
        updateButtonState();
      });
    });

    nextBtn.addEventListener('click', () => {
      if (!(coldPoured && hotPoured && coldThermoPlaced && hotThermoPlaced)) {
        warningMsg.style.display = 'block';
        setTimeout(() => warningMsg.style.display = 'none', 3000);
        return;
      }
      if (timeStep < coldTemps.length - 1) {
        timeStep++;
        elapsedTime += 2;
        nextBtn.textContent = `${elapsedTime}분 건간`;
        const coldTemp = coldTemps[timeStep];
        const hotTemp = hotTemps[timeStep];
        document.getElementById('result').innerHTML =
          `현재 온도:<br>찬물의 온도: ${coldTemp}°C<br>따뜻한 물의 온도: ${hotTemp}°C`;
        coldDisplay.textContent = `${coldTemp}°C`;
        hotDisplay.textContent = `${hotTemp}°C`;
      } else {
        alert('실험이 완료되었습니다.');
      }
    });
  </script>
</body>
</html>
